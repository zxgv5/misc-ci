name: download-files-pixeldrain

on:
  workflow_dispatch:
    inputs:
      pixeldrain_link:
        description: 'Pixeldrain 文件链接 (例如 https://pixeldrain.com/u/xxxxxxxx)'
        required: true
        type: string
      download_path:
        description: '保存路径'
        required: false
        default: './downloads'
        type: string

jobs:
  download:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ci source repo
        uses: actions/checkout@main
        with:
          path: ci_source

      # 确保 curl 可用（GitHub runner 通常已预装）
      - name: Set up tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl

      - name: Parse file ID and download
        run: |
          mkdir -p "${{ inputs.download_path }}"
          # 从 URL 中提取文件 ID（支持带查询参数的情况）
          FILE_ID=$(echo "${{ inputs.pixeldrain_link }}" | sed -E 's#.*/u/([^/?]+).*#\1#')
          echo "提取到的文件 ID: $FILE_ID"
          
          # 使用 curl 下载，附加 Referer 和 User-Agent 以模拟浏览器请求
          curl -L -o "${{ inputs.download_path }}/pixeldrain_${FILE_ID}" \
            -H "Referer: https://pixeldrain.com/u/${FILE_ID}" \
            -H "User-Agent: Mozilla/5.0" \
            "https://pixeldrain.com/api/file/${FILE_ID}"

      - name: List downloaded file
        run: |
          echo "完成列表："
          ls -la ${{ inputs.download_path }}

      - name: Generate timestamp
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV

      - name: Encrypt files and create release
        uses: ./ci_source/.github/actions/aes256pac_release/
        with:
          ZIP_AES256_PWD: ${{ secrets.ZIP_AES256_PWD }}
          # ZIP_COMPRESS_LEVEL: 1
          ARTIFACT_DIRECTORY_PATH: "${{ inputs.download_path }}"
          RELEASE_TAG_NAME: "${{ env.BUILD_DATE }}-from-pixeldrain"