name: sync-fork-libs00
 
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
 
jobs:
  sync-forks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ci repository
        uses: actions/checkout@main
 
      - name: Setup git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
 
      - name: Sync all repositories serially
        env:
          GH_TOKEN: ${{ secrets.SYNC_FORK_TOKEN_LIBS00 }}
        run: |
          # 定义仓库对数组
          repo_pairs=(
            "BACNext/BACNext:zxgv5/lib-BACNext"
            "weidai11/cryptopp:zxgv5/lib-cryptopp"
            "pjkundert/ezpwd-reed-solomon:zxgv5/lib-ezpwd-reed-solomon"
            "jeaiii/itoa:zxgv5/lib-Fast-itoa"
            "FALCONN-LIB/FFHT:zxgv5/lib-FFHT"
            "linbox-team/fflas-ffpack:zxgv5/lib-fflas-ffpack"
            "flintlib/flint:zxgv5/lib-flint"
            "quiet/libfec:zxgv5/lib-libfec"
            "kimwalisch/libpopcnt:zxgv5/lib-libpopcnt"
            "libtom/libtomcrypt:zxgv5/lib-libtomcrypt"
            "libtom/libtommath:zxgv5/lib-libtommath"
            "malb/m4ri:zxgv5/lib-m4ri"
            "BrianGladman/mpir:zxgv5/lib-mpir"
            "libntl/ntl:zxgv5/lib-ntl"
            "greg7mdp/parallel-hashmap:zxgv5/lib-parallel-hashmap"
            "yfedoseev/pdf_oxide:zxgv5/lib-pdfOxide"
            "fastfloat/fast_float:zxgv5/lib-ToNumber"
            "calccrypto/uint128_t:zxgv5/lib-uint128_t"
            "calccrypto/uint256_t:zxgv5/lib-uint256_t"
            "Cyan4973/xxHash:zxgv5/lib-xxHash"
            "softprops/action-gh-release:zxgv5/gh-ReleaseAction"
          )
          for pair in "${repo_pairs[@]}"; do
            SOURCE_REPO="${pair%:*}"
            FORK_REPO="${pair#*:}"
            echo "1、获取 $SOURCE_REPO 默认分支..."
            DEFAULT_BRANCH_INFO=$(git ls-remote --symref "https://github.com/${SOURCE_REPO}.git" HEAD)
            DEFAULT_BRANCH=$(echo "$DEFAULT_BRANCH_INFO" | awk '/^ref:/ {sub(/refs\/heads\//, "", $2); print $2; exit}')
            if [ -z "$DEFAULT_BRANCH" ]; then
              DEFAULT_BRANCH=$(echo "$DEFAULT_BRANCH_INFO" | grep -o 'refs/heads/[^         ]*' | head -1 | sed 's|refs/heads/||')
            fi
            echo "默认分支: $DEFAULT_BRANCH"
            echo "2、克隆镜像仓库..."
            if ! git clone --depth=1 --branch="$DEFAULT_BRANCH" "https://${GH_TOKEN}@github.com/${FORK_REPO}.git" sync-repo; then
              echo "警告：克隆失败，尝试克隆默认分支..."
              rm -rf sync-repo
              git clone --depth=1 "https://${GH_TOKEN}@github.com/${FORK_REPO}.git" sync-repo
              cd sync-repo
              git checkout -b "$DEFAULT_BRANCH" origin/"$DEFAULT_BRANCH" 2>/dev/null || true
            else
              cd sync-repo
            fi
            echo "3、拉取上游更新..."
            git remote add upstream "https://github.com/${SOURCE_REPO}.git" 2>/dev/null || git remote set-url upstream "https://github.com/${SOURCE_REPO}.git"
            git fetch upstream "$DEFAULT_BRANCH"
            echo "4、检查差异..."
            if git diff --quiet FETCH_HEAD "$DEFAULT_BRANCH"; then
              echo "[$DEFAULT_BRANCH] 已是最新，无需同步。"
            else
              echo "检测到更新，正在同步..."
              if git merge --ff-only FETCH_HEAD; then
                git push origin "$DEFAULT_BRANCH"
                echo "[$DEFAULT_BRANCH] 同步完成。"
              else
                echo "警告：快速合并失败，可能是分支历史有分歧。"
                echo "尝试重置并强制推送..."
                git reset --hard FETCH_HEAD
                git push --force origin "$DEFAULT_BRANCH"
                echo "[$DEFAULT_BRANCH] 已强制同步。"
              fi
            fi
            echo "5、清理..."
            cd ..
            rm -rf sync-repo
            echo -e "$SOURCE_REPO 同步完成\n"
            sleep 0.5
          done